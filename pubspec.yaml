name: rally_stats
description: "RallyStats — carga en vivo, planillas de equipo y reportes en PDF de estadísticas de vóley."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  path_provider: ^2.1.3
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: 0.20.3
  share_plus: 13.2.0
  file_picker: ^12.0.0
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.6
  purchases_flutter: ^10.10.0
  purchases_ui_flutter: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon_petals.png
